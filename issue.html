<script>
  (function () {
    try {
      var mode = localStorage.getItem('contribmatch:v1:theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var lang = localStorage.getItem('contribmatch:v1:lang') || 'en';
      document.documentElement.setAttribute('data-lang', lang);
      document.documentElement.lang = lang === 'hi' ? 'hi' : (lang === 'hinglish' ? 'en-Latn' : 'en');
    } catch (e) { /* ignore */ }
  })();
